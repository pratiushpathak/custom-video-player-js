<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom-video-player</title>
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> -->
</head>
  <link rel="stylesheet" href="videoplayer.css">
  <link rel="stylesheet" href="progress.css">
</head>
<body style="height: 3000px;">

  <h1>Custom Video Player</h1>
 
  <video 

  src="3195394-uhd_3840_2160_25fps.mp4" id="video" class="screen" poster="poster.png"></video>

  <div class="control">
   <button class="btn" id="play">
    <img src="play-button-arrowhead.png" alt="" style="height: 10px;">
   </button>
   <button class="btn" id="stop">
    <img src="pause.png" alt="" style="height: 10px;">
   </button>
   <input type="range" name="" id="progress" min="0" max="100" step="0.1">
   <span class="timesamp" id="timesamp">00:00</span>
  </div>
  
  <script src="videoplayer.js"></script>
</body>
</html>
